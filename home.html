<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Explorer!</title>
    <link rel="stylesheet" href="home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="decoration decoration-top-right"></div>
    <div class="decoration decoration-bottom-left"></div>
    <header>
        <h1>Game Explorer 
            <span class="controler-icon">
                <svg xmlns="http://www.w3.org/2000/svg"
                width="64" 
                height="64" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                stroke-width="1.75" 
                stroke-linecap="round" 
                stroke-linejoin="round" 
                class="lucide lucide-gamepad-2 preview-icon">
                <line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/>
                <line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/>
                <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>
                </svg>
            </span>
        </h1>
        <h2> Discover new games base on your favorite generes and styles!</h2>
    </header>
    <main>
        <div>
            <form class="search-form">
                <span>
                    <svg xmlns="http://www.w3.org/2000/svg" 
                    width="24" 
                    height="24" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="1.75" 
                    stroke-linecap="round" 
                    stroke-linejoin="round" 
                    class="lucide lucide-search preview-icon">
                    <path d="m21 21-4.34-4.34"/>
                    <circle cx="11" cy="11" r="8"/>
                </svg>
                </span>
                
                <input
                    
                    type="search"
                    id="game-search"
                    name="game"
                    placeholder="Search genres, games and studios!"
                    aria-label="Search for games"

                >
            </form>
        </div>
        <div>
            <h2 class="title">Trending</h2>
            <button class="game-cards">
                
            </button>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
